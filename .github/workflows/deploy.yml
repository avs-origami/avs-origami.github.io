# Add this workflow to your private repository (.github/workflows/deploy.yml)
name: Deploy to Public Pages Repo
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Deploy to Public Repo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }} # A Personal Access Token with repo access
          repository-name: avs-origami/website
          branch: main # Or gh-pages
          folder: . # The folder containing your site files
          single-commit: true # This completely wipes past history on the public repo
